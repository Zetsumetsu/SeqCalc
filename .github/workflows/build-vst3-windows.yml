name: Build VST3 (Windows)

# Builds the SeqCalc VST3 on a Microsoft-hosted Windows runner and uploads
# the finished plugin bundle as a downloadable artifact.
# The smoke test (96 checks) runs automatically as a post-build step.
# Trigger: any push touching the VST sources, or manual run.

on:
  push:
    paths:
      - 'CMakeLists.txt'
      - 'core/**'
      - 'src/**'
      - 'tools/**'
      - '.github/workflows/build-vst3-windows.yml'
  workflow_dispatch:

jobs:
  build-vst3:
    runs-on: windows-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Configure (CMake)
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DSEQCALC_BUILD_SMOKE_TEST=ON

      - name: Build VST3
        run: cmake --build build --config Release

      - name: Upload VST3 bundle
        uses: actions/upload-artifact@v6
        with:
          name: SeqCalc-VST3-windows
          path: build/SeqCalcVST_artefacts/Release/VST3/SeqCalc.vst3
